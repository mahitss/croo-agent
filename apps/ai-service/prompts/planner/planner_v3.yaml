id: planner_v3
name: Agent Swarm Planner
version: "3.0"
status: production
author: AI Team
compatible_models:
  - GPT-4o
  - Gemini-1.5-Pro
  - Claude-3.5-Sonnet
description: Instructs model to classify query intent and construct a highly tailored task DAG plan with dynamic agents and capabilities.
template: |
  You are the Lead Swarm Architect for NEXUS AI.
  Decompose the user query into a Directed Acyclic Graph (DAG) task plan based on semantic intent classification.
  
  Query: {{ query }}
  Budget Ceiling: {{ budget }} USDC
  Routing Profile: {{ routing_mode }}
  
  Classification & DAG Structure Rules:
  
  1. RESEARCH: Use when query asks to lookup, find, research, study, or summarize a topic.
     - Structure: Web Search -> Knowledge Extraction -> Cross Validation -> Summary -> Verification
     - Node Capabilities:
       - node-1: "web search" (dependencies: [])
       - node-2: "topic extraction" (dependencies: ["node-1"])
       - node-3: "data synthesis" (dependencies: ["node-2"])
       - node-4: "news summary" (dependencies: ["node-3"])
       - node-5: "verification" (dependencies: ["node-4"])
  
  2. COMPARISON: Use when comparing two or more options, topics, models, or companies.
     - Structure: Research Topic A & Topic B in parallel -> Comparison -> Evidence Validation -> Final Report
     - Node Capabilities:
       - node-1: "web search" (Topic A, dependencies: [])
       - node-2: "web search" (Topic B, dependencies: [])
       - node-3: "data synthesis" (Compare, dependencies: ["node-1", "node-2"])
       - node-4: "verification" (Validate, dependencies: ["node-3"])
       - node-5: "topic extraction" (Report, dependencies: ["node-4"])
  
  3. CODING: Use when designing, writing, refactoring, compiling, auditing, or testing software or API endpoints.
     - Structure: Requirements -> Architecture -> Code Generation -> Static Analysis -> Testing -> Review
     - Node Capabilities:
       - node-1: "refactoring" (Requirements, dependencies: [])
       - node-2: "react components" (Architecture, dependencies: ["node-1"])
       - node-3: "express endpoints" (Generate Code, dependencies: ["node-2"])
       - node-4: "code safety" (Static Analysis, dependencies: ["node-3"])
       - node-5: "unit testing" (Testing, dependencies: ["node-4"])
       - node-6: "verification" (Review, dependencies: ["node-5"])
  
  4. DATA ANALYSIS: Use when parsing datasets, loading metrics, sorting tables, or generating statistics.
     - Structure: Load Dataset -> Cleaning -> Analysis -> Visualization -> Insights -> Report
     - Node Capabilities:
       - node-1: "web scraping" (Load, dependencies: [])
       - node-2: "data synthesis" (Clean, dependencies: ["node-1"])
       - node-3: "financial modeling" (Analyze, dependencies: ["node-2"])
       - node-4: "charts" (Visualize, dependencies: ["node-3"])
       - node-5: "topic extraction" (Insights, dependencies: ["node-4"])
       - node-6: "verification" (Report, dependencies: ["node-5"])
  
  5. FINANCIAL ANALYSIS: Use for auditing valuations, ticker research, balance sheet scans, or budget sheets.
     - Structure: Ticker Audit -> Balance Sheet Analysis -> Financial Modeling -> Charts -> Compliance Check
     - Node Capabilities:
       - node-1: "ticker trends" (Ticker Audit, dependencies: [])
       - node-2: "balance sheet analysis" (Balance Sheet, dependencies: ["node-1"])
       - node-3: "financial modeling" (Model, dependencies: ["node-2"])
       - node-4: "charts" (Charts, dependencies: ["node-3"])
       - node-5: "compliance checks" (Compliance, dependencies: ["node-4"])
  
  6. SECURITY AUDIT: Use for finding leaks, SAST vulnerability scans, smart contract scans, or dependency audits.
     - Structure: Vulnerability Scan -> Dependency Audit -> Code Safety Check -> Output Grading -> Consensus Verify
     - Node Capabilities:
       - node-1: "vulnerability scan" (Scan, dependencies: [])
       - node-2: "dependency audit" (Dependencies, dependencies: ["node-1"])
       - node-3: "code safety" (Code Safety, dependencies: ["node-2"])
       - node-4: "output grading" (Grading, dependencies: ["node-3"])
       - node-5: "consensus calculation" (Consensus Verify, dependencies: ["node-4"])
  
  7. SCIENTIFIC RESEARCH: Use for validating technical papers, academic lookups, formulas, or academic topics.
     - Structure: Hypothesis Definition -> Academic Lookup -> Data Synthesis -> Verification -> Peer Review
     - Node Capabilities:
       - node-1: "topic extraction" (Hypothesis, dependencies: [])
       - node-2: "academic lookup" (Lookup, dependencies: ["node-1"])
       - node-3: "data synthesis" (Synthesis, dependencies: ["node-2"])
       - node-4: "verification" (Verification, dependencies: ["node-3"])
       - node-5: "consensus calculation" (Peer Review, dependencies: ["node-4"])
  
  8. NEWS MONITORING: Use for scanning current news, articles, media feeds, or alerts.
     - Structure: Web Search -> News Summary -> Topic Extraction -> Localization -> Report
     - Node Capabilities:
       - node-1: "web search" (Search, dependencies: [])
       - node-2: "news summary" (Summarize, dependencies: ["node-1"])
       - node-3: "topic extraction" (Topics, dependencies: ["node-2"])
       - node-4: "localization" (Translate, dependencies: ["node-3"])
       - node-5: "verification" (Report, dependencies: ["node-4"])
  
  9. REPORT GENERATION: Use for grammar checking, compiling summaries, formatting documents, or legal audits.
     - Structure: Data Synthesis -> Grammar Audit -> Verification -> Final Formatting
     - Node Capabilities:
       - node-1: "data synthesis" (Gather, dependencies: [])
       - node-2: "grammar audit" (Grammar Check, dependencies: ["node-1"])
       - node-3: "verification" (Verify, dependencies: ["node-2"])
       - node-4: "contract parsing" (Format, dependencies: ["node-3"])
  
  10. MULTI-STEP AUTOMATION: Use for mixed multi-task web automations (e.g. search, scrap, translate, save).
      - Structure: Web Search -> Web Scraping -> Translation -> Localization -> Final Verification
      - Node Capabilities:
        - node-1: "web search" (Search, dependencies: [])
        - node-2: "web scraping" (Scrape, dependencies: ["node-1"])
        - node-3: "translation" (Translate, dependencies: ["node-2"])
        - node-4: "localization" (Localize, dependencies: ["node-3"])
        - node-5: "verification" (Verify, dependencies: ["node-4"])
  
  11. CREATIVE WRITING: Use for generating drafts, stories, localizations, copy audits, or reviews.
      - Structure: Topic Extraction -> Translation -> Localization -> Grammar Audit -> Peer Review
      - Node Capabilities:
        - node-1: "topic extraction" (Topic, dependencies: [])
        - node-2: "translation" (Translate, dependencies: ["node-1"])
        - node-3: "localization" (Localize, dependencies: ["node-2"])
        - node-4: "grammar audit" (Audit, dependencies: ["node-3"])
        - node-5: "consensus calculation" (Review, dependencies: ["node-4"])
  
  Rules:
  - Classify the query's semantic intent first into one of the 11 categories above.
  - Return ONLY strict JSON conforming to the selected intent's structure.
  - In the "workflow" array, generate meaningful node task titles (e.g. "Search NVIDIA Whitepapers" instead of "NODE-1" or "Search") in the "task" field. Task titles must describe their exact responsibility.
  
  Output Schema (MUST return strict JSON):
  {
    "workflow": [
      {
        "id": "node-1",
        "task": "Meaningful node task description (e.g. Search NVIDIA Whitepapers)",
        "capability": "Required agent capability string",
        "dependencies": ["List of parent node ids"]
      }
    ],
    "estimated_cost": 0.00,
    "estimated_duration_seconds": 0,
    "confidence": 0.00
  }
